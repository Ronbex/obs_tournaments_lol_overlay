<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Broadcast Overlay</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1117;
            --panel-bg: #181b24;
            --panel-border: #262b38;
            --input-bg: #0f1117;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --stage-bg: linear-gradient(135deg, #0b1329 0%, #1c3564 50%, #080c18 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* MODO OBS OVERLAY PANTALLA COMPLETA */
        body.obs-mode {
            background: transparent !important;
        }

        body.obs-mode .control-panel,
        body.obs-mode .controls-hint {
            display: none !important;
        }

        body.obs-mode .preview-area {
            padding: 0 !important;
            background: transparent !important;
            width: 100vw;
            height: 100vh;
        }

        body.obs-mode .stage-wrapper {
            box-shadow: none !important;
            border-radius: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
        }

        body.obs-mode .stage {
            transform: scale(1) !important;
            width: 100% !important;
            height: 100% !important;
        }

        /* --- UI PANEL LATERAL --- */
        .control-panel {
            width: 420px;
            background: var(--panel-bg);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 20px;
            overflow-y: auto;
            z-index: 10;
        }

        .control-panel::-webkit-scrollbar {
            width: 6px;
        }
        .control-panel::-webkit-scrollbar-thumb {
            background: var(--panel-border);
            border-radius: 3px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--panel-border);
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #fff;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        .section-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input[type="text"], select {
            background: var(--input-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            transition: border 0.2s;
        }

        input[type="text"]::placeholder {
            color: #6b7280;
            opacity: 0.8;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
        }

        .file-upload-btn {
            position: relative;
            background: var(--input-bg);
            border: 1px dashed var(--panel-border);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .file-upload-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .file-upload-btn input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .checkbox-group input {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
        }

        /* Lista de Equipos */
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .item-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--input-bg);
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
        }

        .item-row input[type="text"] {
            flex: 1;
            padding: 6px 8px;
        }

        .mini-btn-file {
            width: 32px;
            height: 32px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
        }

        .mini-btn-file img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }

        .mini-btn-file input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .btn-action {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 6px;
        }

        .btn-action:hover {
            background: var(--accent-hover);
        }

        .btn-danger-icon {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
        }

        .btn-danger-icon:hover {
            color: var(--danger);
        }

        /* --- VISTA PREVIA / ESCENARIO --- */
        .preview-area {
            flex: 1;
            background: #060709;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        .stage-wrapper {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            background: var(--stage-bg);
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 75px 90px;
            transform-origin: top left;
        }

        .header-block {
            z-index: 2;
        }

        .main-title {
            font-size: 4.8rem;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: -0.01em;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.6);
            line-height: 1.1;
        }

        .sub-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* Grilla de Equipos */
        .teams-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 30px;
            z-index: 2;
            height: 600px;
            width: 100%;
            margin: auto;
        }

        .team-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(25px) scale(0.95);
            animation: teamAppear 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes teamAppear {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .team-avatar-frame {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }

        .team-avatar-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }

        .team-label {
            font-weight: 800;
            text-transform: uppercase;
            color: #ffffff;
            margin-top: 12px;
            text-align: center;
            width: 100%;
            word-break: break-word;
            line-height: 1.15;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            letter-spacing: 0.01em;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            max-height: 2.5em;
        }

        /* Footer */
        .footer-block {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 2;
        }

        .sponsors-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sponsors-heading {
            font-size: 1.2rem;
            font-weight: 700;
            color: #e5e7eb;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .sponsors-flex {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .sponsor-img {
            height: 48px;
            max-width: 160px;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        .organizer-group {
            display: flex;
            align-items: center;
            gap: 18px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 24px;
            border-radius: 40px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .organizer-text {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .organizer-img {
            height: 40px;
            max-width: 140px;
            object-fit: contain;
        }

        .controls-hint {
            position: absolute;
            bottom: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- CONTROL PANEL -->
    <div class="control-panel">
        <div class="panel-header">
            <h1 class="panel-title">Configuración</h1>
            <button class="btn-reset" onclick="resetToDefaults()">Restablecer</button>
        </div>

        <div>
            <div class="section-title">Encabezado y Estilo</div>
            <div class="form-group">
                <label>Título Principal</label>
                <input type="text" id="cfgTitle" placeholder="NOMBRE DEL TORNEO">
            </div>
            <div class="form-group">
                <label>Subtítulo (Prefijo)</label>
                <input type="text" id="cfgSubtitle" placeholder="TOTAL EQUIPOS">
            </div>
            <div class="form-group">
                <label>Estilo / Fondo de Pantalla</label>
                <select id="cfgBgPreset" onchange="changeBgPreset()">
                    <option value="default">Azul Torneo (Clásico)</option>
                    <option value="dark">Modo Carbono Oscuro</option>
                    <option value="purple">Púrpura Esports</option>
                    <option value="red">Rojo Competitivo</option>
                    <option value="green">Verde Arena</option>
                </select>
            </div>
            <div class="form-group">
                <label>O Subir Fondo Personalizado</label>
                <div class="file-upload-btn">
                    <span id="bgFileName">Seleccionar Imagen...</span>
                    <input type="file" id="cfgBg" accept="image/*">
                </div>
            </div>
        </div>

        <!-- Equipos -->
        <div>
            <div class="section-title">Equipos (<span id="teamCount">0</span>/30)</div>
            <div class="items-list" id="teamsList"></div>
            <button class="btn-action" onclick="addTeam()">+ Añadir Equipo</button>
        </div>

        <!-- Patrocinadores -->
        <div>
            <div class="section-title">Patrocinadores</div>
            <div class="form-group checkbox-group" style="margin-bottom: 10px;">
                <input type="checkbox" id="cfgShowSponsors">
                <label for="cfgShowSponsors" style="color:#fff; cursor:pointer;">Mostrar "Con el apoyo de"</label>
            </div>
            <div class="items-list" id="sponsorsList"></div>
            <button class="btn-action" onclick="addSponsor()" id="btnAddSponsor">+ Añadir Patrocinador</button>
        </div>

        <!-- Organizador -->
        <div>
            <div class="section-title">Organizador</div>
            <div class="form-group">
                <label>Texto</label>
                <input type="text" id="cfgOrgText" placeholder="Nombre de la entidad que organiza">
            </div>
            <div class="form-group">
                <label>Logo Organizador</label>
                <div class="file-upload-btn">
                    <span id="orgFileName">Cargar Logo...</span>
                    <input type="file" id="cfgOrgLogo" accept="image/*">
                </div>
            </div>
        </div>
    </div>

    <!-- PREVIEW AREA -->
    <div class="preview-area" id="previewArea">
        <div class="stage-wrapper" id="stageWrapper">
            <div class="stage" id="stage">
                <div class="header-block">
                    <div class="main-title" id="displayTitle"></div>
                    <div class="sub-title" id="displaySubtitle"></div>
                </div>

                <div class="teams-container" id="displayTeams"></div>

                <div class="footer-block">
                    <div class="sponsors-group" id="displaySponsorsGroup">
                        <div class="sponsors-heading">Con el apoyo de</div>
                        <div class="sponsors-flex" id="displaySponsors"></div>
                    </div>
                    <div class="organizer-group">
                        <span class="organizer-text" id="displayOrgText"></span>
                        <img id="displayOrgLogo" class="organizer-img" style="display: none;">
                    </div>
                </div>
            </div>
        </div>
        <div class="controls-hint">Link OBS: añade <b>?obs=true</b> al final del enlace</div>
    </div>

    <script>
        const channel = new BroadcastChannel('obs_overlay_sync');

        const BG_PRESETS = {
            default: 'linear-gradient(135deg, #0b1329 0%, #1c3564 50%, #080c18 100%)',
            dark: 'linear-gradient(135deg, #090a0f 0%, #161922 50%, #050608 100%)',
            purple: 'linear-gradient(135deg, #13091f 0%, #391c5e 50%, #08040f 100%)',
            red: 'linear-gradient(135deg, #1f0909 0%, #5e1c1c 50%, #0f0404 100%)',
            green: 'linear-gradient(135deg, #091f13 0%, #1c5e39 50%, #040f08 100%)'
        };

        const DEFAULT_DATA = {
            title: "",
            subtitle: "",
            showSponsors: true,
            orgText: "",
            bgPreset: "default",
            bgImage: "",
            orgLogo: "",
            teams: [
                { name: "", logo: "" },
                { name: "", logo: "" },
                { name: "", logo: "" },
                { name: "", logo: "" }
            ],
            sponsors: []
        };

        const DEFAULT_TITLE_PLACEHOLDER = "NOMBRE DEL TORNEO";
        const DEFAULT_SUBTITLE_PLACEHOLDER = "TOTAL EQUIPOS";
        const DEFAULT_ORG_PLACEHOLDER = "Nombre de la entidad que organiza";

        let state = { ...DEFAULT_DATA };

        function loadState() {
            const saved = localStorage.getItem('tournament_anim_data_v4');
            if (saved) {
                try {
                    state = JSON.parse(saved);
                } catch(e) {
                    state = JSON.parse(JSON.stringify(DEFAULT_DATA));
                }
            }
        }

        function saveState() {
            localStorage.setItem('tournament_anim_data_v4', JSON.stringify(state));
            try {
                channel.postMessage(state);
            } catch(e){}
        }

        channel.onmessage = (event) => {
            if (event.data) {
                state = event.data;
                updatePreview();
            }
        };

        window.addEventListener('storage', (e) => {
            if (e.key === 'tournament_anim_data_v4') {
                loadState();
                updatePreview();
            }
        });

        const cfgTitle = document.getElementById('cfgTitle');
        const cfgSubtitle = document.getElementById('cfgSubtitle');
        const cfgBgPreset = document.getElementById('cfgBgPreset');
        const cfgBg = document.getElementById('cfgBg');
        const cfgShowSponsors = document.getElementById('cfgShowSponsors');
        const cfgOrgText = document.getElementById('cfgOrgText');
        const cfgOrgLogo = document.getElementById('cfgOrgLogo');

        const displayTitle = document.getElementById('displayTitle');
        const displaySubtitle = document.getElementById('displaySubtitle');
        const displayTeams = document.getElementById('displayTeams');
        const displaySponsorsGroup = document.getElementById('displaySponsorsGroup');
        const displaySponsors = document.getElementById('displaySponsors');
        const displayOrgText = document.getElementById('displayOrgText');
        const displayOrgLogo = document.getElementById('displayOrgLogo');
        const stage = document.getElementById('stage');

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('obs') === 'true') {
                document.body.classList.add('obs-mode');
                setInterval(() => {
                    loadState();
                    updatePreview();
                }, 500);
            }

            loadState();
            syncFormValues();
            buildTeamsUI();
            buildSponsorsUI();
            updatePreview();
            setupAutoResize();
        }

        function syncFormValues() {
            cfgTitle.value = state.title || '';
            cfgSubtitle.value = state.subtitle || '';
            cfgBgPreset.value = state.bgPreset || 'default';
            cfgShowSponsors.checked = state.showSponsors;
            cfgOrgText.value = state.orgText || '';
        }

        function buildTeamsUI() {
            document.getElementById('teamCount').textContent = state.teams.length;
            const container = document.getElementById('teamsList');
            container.innerHTML = '';

            state.teams.forEach((team, idx) => {
                const row = document.createElement('div');
                row.className = 'item-row';
                
                const miniBtn = document.createElement('div');
                miniBtn.className = 'mini-btn-file';
                miniBtn.innerHTML = team.logo ? `<img src="${team.logo}">` : '📷';
                
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = 'image/*';
                fileInput.onchange = (e) => uploadTeamLogo(idx, e);
                miniBtn.appendChild(fileInput);

                const textInput = document.createElement('input');
                textInput.type = 'text';
                textInput.value = team.name || '';
                textInput.placeholder = `Equipo ${idx + 1}`;
                textInput.oninput = (e) => {
                    state.teams[idx].name = e.target.value;
                    updatePreview();
                    saveState();
                };

                const delBtn = document.createElement('button');
                delBtn.className = 'btn-danger-icon';
                delBtn.innerHTML = `<svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>`;
                delBtn.onclick = () => removeTeam(idx);

                row.appendChild(miniBtn);
                row.appendChild(textInput);
                row.appendChild(delBtn);
                container.appendChild(row);
            });
        }

        function buildSponsorsUI() {
            const container = document.getElementById('sponsorsList');
            container.innerHTML = '';

            state.sponsors.forEach((sp, idx) => {
                const row = document.createElement('div');
                row.className = 'item-row';
                
                const miniBtn = document.createElement('div');
                miniBtn.className = 'mini-btn-file';
                miniBtn.innerHTML = sp.logo ? `<img src="${sp.logo}">` : '📷';
                
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = 'image/*';
                fileInput.onchange = (e) => uploadSponsorLogo(idx, e);
                miniBtn.appendChild(fileInput);

                const span = document.createElement('span');
                span.style.cssText = 'flex:1; font-size:0.75rem; color:var(--text-muted);';
                span.textContent = `Patrocinador #${idx+1}`;

                const delBtn = document.createElement('button');
                delBtn.className = 'btn-danger-icon';
                delBtn.innerHTML = `<svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>`;
                delBtn.onclick = () => removeSponsor(idx);

                row.appendChild(miniBtn);
                row.appendChild(span);
                row.appendChild(delBtn);
                container.appendChild(row);
            });
        }

        function updatePreview() {
            displayTitle.textContent = state.title.trim() !== '' ? state.title : DEFAULT_TITLE_PLACEHOLDER;

            const subText = state.subtitle.trim() !== '' ? state.subtitle.toUpperCase() : DEFAULT_SUBTITLE_PLACEHOLDER;
            displaySubtitle.textContent = `${subText} #${state.teams.length}`;

            if (state.bgImage) {
                stage.style.backgroundImage = `url('${state.bgImage}')`;
            } else {
                stage.style.backgroundImage = BG_PRESETS[state.bgPreset] || BG_PRESETS.default;
            }

            const orgTextVal = state.orgText.trim() !== '' ? state.orgText : DEFAULT_ORG_PLACEHOLDER;
            displayOrgText.textContent = orgTextVal.toUpperCase().startsWith("ORGANIZA") ? orgTextVal : `ORGANIZA ${orgTextVal}`;
            
            if (state.orgLogo) {
                displayOrgLogo.src = state.orgLogo;
                displayOrgLogo.style.display = 'block';
            } else {
                displayOrgLogo.style.display = 'none';
            }

            displaySponsorsGroup.style.display = state.showSponsors ? 'flex' : 'none';
            renderSponsorsPreview();
            renderTeamsPreview();
        }

        function renderTeamsPreview() {
            displayTeams.innerHTML = '';
            const count = state.teams.length;

            let avatarSize = 130;
            let cardWidth = 180;
            let fontSize = '1rem';

            if (count > 6 && count <= 12) {
                avatarSize = 110;
                cardWidth = 150;
                fontSize = '0.9rem';
            } else if (count > 12 && count <= 20) {
                avatarSize = 90;
                cardWidth = 125;
                fontSize = '0.8rem';
            } else if (count > 20) {
                avatarSize = 75;
                cardWidth = 105;
                fontSize = '0.7rem';
            }

            state.teams.forEach((team, idx) => {
                const card = document.createElement('div');
                card.className = 'team-card';
                card.style.width = `${cardWidth}px`;
                card.style.animationDelay = `${idx * 0.03}s`;

                const defaultIcon = `<svg width="40" height="40" fill="rgba(255,255,255,0.4)" viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 3.83L19.13 19H4.87L12 5.83z"/></svg>`;
                const teamName = team.name.trim() !== '' ? team.name : `Equipo ${idx + 1}`;

                card.innerHTML = `
                    <div class="team-avatar-frame" style="width: ${avatarSize}px; height: ${avatarSize}px; padding: ${avatarSize * 0.12}px;">
                        ${team.logo ? `<img src="${team.logo}">` : defaultIcon}
                    </div>
                    <div class="team-label" style="font-size: ${fontSize};" title="${teamName}">${teamName}</div>
                `;
                displayTeams.appendChild(card);
            });
        }

        function renderSponsorsPreview() {
            displaySponsors.innerHTML = '';
            state.sponsors.forEach((sp) => {
                if (sp.logo) {
                    const img = document.createElement('img');
                    img.src = sp.logo;
                    img.className = 'sponsor-img';
                    displaySponsors.appendChild(img);
                }
            });
        }

        cfgTitle.addEventListener('input', (e) => { state.title = e.target.value; updatePreview(); saveState(); });
        cfgSubtitle.addEventListener('input', (e) => { state.subtitle = e.target.value; updatePreview(); saveState(); });
        cfgOrgText.addEventListener('input', (e) => { state.orgText = e.target.value; updatePreview(); saveState(); });
        cfgShowSponsors.addEventListener('change', (e) => { state.showSponsors = e.target.checked; updatePreview(); saveState(); });

        function changeBgPreset() {
            state.bgPreset = cfgBgPreset.value;
            state.bgImage = '';
            document.getElementById('bgFileName').textContent = 'Seleccionar Imagen...';
            updatePreview();
            saveState();
        }

        cfgBg.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    state.bgImage = ev.target.result;
                    document.getElementById('bgFileName').textContent = file.name;
                    updatePreview();
                    saveState();
                };
                reader.readAsDataURL(file);
            }
        });

        cfgOrgLogo.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    state.orgLogo = ev.target.result;
                    document.getElementById('orgFileName').textContent = file.name;
                    updatePreview();
                    saveState();
                };
                reader.readAsDataURL(file);
            }
        });

        function addTeam() {
            if (state.teams.length >= 30) return;
            state.teams.push({ name: '', logo: '' });
            buildTeamsUI();
            updatePreview();
            saveState();
        }

        function removeTeam(idx) {
            state.teams.splice(idx, 1);
            buildTeamsUI();
            updatePreview();
            saveState();
        }

        function uploadTeamLogo(idx, e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    state.teams[idx].logo = ev.target.result;
                    buildTeamsUI();
                    updatePreview();
                    saveState();
                };
                reader.readAsDataURL(file);
            }
        }

        function addSponsor() {
            if (state.sponsors.length >= 10) return;
            state.sponsors.push({ logo: '' });
            buildSponsorsUI();
            updatePreview();
            saveState();
        }

        function removeSponsor(idx) {
            state.sponsors.splice(idx, 1);
            buildSponsorsUI();
            updatePreview();
            saveState();
        }

        function uploadSponsorLogo(idx, e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    state.sponsors[idx].logo = ev.target.result;
                    buildSponsorsUI();
                    updatePreview();
                    saveState();
                };
                reader.readAsDataURL(file);
            }
        }

        function resetToDefaults() {
            state = JSON.parse(JSON.stringify(DEFAULT_DATA));
            syncFormValues();
            document.getElementById('bgFileName').textContent = 'Seleccionar Imagen...';
            document.getElementById('orgFileName').textContent = 'Cargar Logo...';
            buildTeamsUI();
            buildSponsorsUI();
            updatePreview();
            saveState();
        }

        function setupAutoResize() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('obs') === 'true') return;

            const previewArea = document.getElementById('previewArea');
            const wrapper = document.getElementById('stageWrapper');

            function resize() {
                const padding = 60;
                const availableWidth = previewArea.clientWidth - padding;
                const availableHeight = previewArea.clientHeight - padding;

                const scaleX = availableWidth / 1920;
                const scaleY = availableHeight / 1080;
                const scale = Math.min(scaleX, scaleY, 1);

                wrapper.style.width = `${1920 * scale}px`;
                wrapper.style.height = `${1080 * scale}px`;
                stage.style.transform = `scale(${scale})`;
            }

            window.addEventListener('resize', resize);
            resize();
        }

        window.onload = init;
    </script>
</body>
</html>
